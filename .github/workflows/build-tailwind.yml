name: Build local Tailwind stylesheet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailwind-css
  cancel-in-progress: true

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned Tailwind stylesheet
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i assets/tailwind.input.css -o "$RUNNER_TEMP/tailwind.generated.css" --minify
          if ! cmp -s assets/tailwind.generated.css "$RUNNER_TEMP/tailwind.generated.css"; then
            echo "::error::The committed Tailwind stylesheet is out of date. Regenerate it and include the result in a pull request."
            diff -u assets/tailwind.generated.css "$RUNNER_TEMP/tailwind.generated.css" || true
            exit 1
          fi
          echo "Committed Tailwind stylesheet matches the pinned compiler output."
