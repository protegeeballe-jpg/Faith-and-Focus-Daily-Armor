name: App regression and security tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: regression-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application module syntax
        run: |
          node --check assets/app.js
          node --check assets/guide-quotes.js
          node --check assets/missed-card-notifications.js
          node --check sw.js
          node --check assets/service-worker-registration.js
          node --check assets/app-gate.js
          node --check assets/account-security.js
          node --check assets/writing-security.js
          node --check assets/diary-archive.js
          node --check assets/vault-crypto.js
          node --check assets/vault-session.js
          node --check assets/vault-sync.js
          node --check assets/backup-import-transaction.js
          node --check assets/vault-storage.js
          node --check assets/local-backup.js
          node --check worker.js
          node --check assets/garden.js
          node --check assets/settings-modal.js
          node --check assets/garden-model.js
          node --check assets/drive-sync.js
          node --check assets/gist-sync.js
          node --check assets/location-checkin.js
          node --check assets/voice-note-store.js
      - name: Verify generated Tailwind stylesheet
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i assets/tailwind.input.css -o "$RUNNER_TEMP/tailwind.generated.css" --minify
          diff -u assets/tailwind.generated.css "$RUNNER_TEMP/tailwind.generated.css"
      - name: Validate Worker configuration and bundle
        run: npx --yes wrangler@4.134.0 deploy --dry-run --outdir=/tmp/faith-focus-worker
      - name: Install Chromium browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Run regression and security tests
        run: node --test tests/*.test.mjs
