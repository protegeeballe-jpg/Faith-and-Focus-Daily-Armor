<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watercolor guide browser smoke test</title>
  <link rel="stylesheet" href="../assets/app.css">
  <style>
    body { margin: 0; padding: 24px; background: #fbf8ef; }
    .fixture-row { display: grid; grid-template-columns: 1fr; gap: 16px; max-width: 420px; margin: 0 auto 24px; }
    #all-guides { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; max-width:900px; margin:0 auto; }
    #all-guides .watercolor-guide-stage { min-width:0; min-height:100px; border:1px solid #e6ddce; border-radius:12px; background:#fffaf2; }
  </style>
</head>
<body>
  <main class="fixture-row">
    <div id="hydration-stage" class="watercolor-guide-stage"></div>
    <div id="breathing-stage" class="watercolor-guide-stage watercolor-guide-stage--breathing"></div>
    <div id="cloud-stage" class="watercolor-guide-stage watercolor-guide-stage--cloud"></div>
    <section id="all-guides" aria-label="All 23 storyboard browser fixtures"></section>
  </main>
  <script type="module">
    import { GUIDE_ILLUSTRATION_IDS, buildGuideIllustrationSvg } from '../assets/watercolor-illustrations.js';
    import { createWatercolorGuidePlayer } from '../assets/guide-player.js';
    import { getGuideStoryboard } from '../assets/storyboard-choreographer.js';

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const requireValue = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const scaleFromMatrix = (value) => {
      const match = value.match(/^matrix\(([^,]+)/);
      return match ? Number(match[1]) : NaN;
    };

    try {
      const prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const hydrationStage = document.getElementById('hydration-stage');
      hydrationStage.innerHTML = buildGuideIllustrationSvg('start-4');
      const hydrationPlayer = createWatercolorGuidePlayer({
        guideId: 'start-4',
        stage: hydrationStage
      });
      const drinkingArm = hydrationStage.querySelector('.wgi-arm--right');
      const hydrationStartTransform = getComputedStyle(drinkingArm).transform;
      await wait(1200);
      const hydrationEndTransform = getComputedStyle(drinkingArm).transform;
      const hydrationStyle = getComputedStyle(drinkingArm);

      requireValue(hydrationStage.dataset.playbackMode === 'finite', 'Hydration mode was not finite.');
      requireValue(prefersReducedMotion
        ? hydrationStyle.animationName === 'none'
        : hydrationStyle.animationName === 'wgi-story-start-4-rightArm',
        'Hydration animation did not respect the motion preference.');
      if (!prefersReducedMotion) {
        requireValue(hydrationStyle.animationIterationCount === '1', 'Hydration did not use one finite demonstration.');
        requireValue(hydrationStyle.animationPlayState === 'running', 'Hydration animation was paused before completion.');
        requireValue(hydrationStartTransform !== hydrationEndTransform, 'Hydration character did not visibly move in Chromium.');
      } else {
        requireValue(hydrationStartTransform === hydrationEndTransform, 'Hydration moved despite reduced motion being requested.');
      }

      const breathingStage = document.getElementById('breathing-stage');
      breathingStage.innerHTML = buildGuideIllustrationSvg('mid-2');
      const breathingPlayer = createWatercolorGuidePlayer({
        guideId: 'mid-2',
        stage: breathingStage
      });
      const breathRing = breathingStage.querySelector('.wgi-breath-ring');
      const restingScale = scaleFromMatrix(getComputedStyle(breathRing).transform);
      requireValue(breathingPlayer.setBreathingPhase('inhale'), 'Breathing inhale phase was rejected.');
      await wait(300);
      const inhaleScale = scaleFromMatrix(getComputedStyle(breathRing).transform);
      const inhaleTransition = getComputedStyle(breathRing).transitionDuration;
      requireValue(breathRing.ownerSVGElement.dataset.breathPhase === 'inhale', 'Breathing phase did not reach the SVG.');
      requireValue(prefersReducedMotion ? inhaleTransition === '0s' : inhaleTransition.includes('4s'),
        'Breathing inhale transition did not respect the motion preference.');
      requireValue(Number.isFinite(inhaleScale) && inhaleScale > restingScale, 'Breathing ring did not expand on inhale.');
      requireValue(breathingPlayer.setBreathingPhase('hold'), 'Breathing hold phase was rejected.');
      const holdTransition = getComputedStyle(breathRing).transitionDuration;
      requireValue(prefersReducedMotion ? holdTransition === '0s' : holdTransition.includes('2s'),
        'Breathing hold transition did not respect the motion preference.');
      requireValue(breathingPlayer.setBreathingPhase('exhale'), 'Breathing exhale phase was rejected.');
      const exhaleTransition = getComputedStyle(breathRing).transitionDuration;
      requireValue(prefersReducedMotion ? exhaleTransition === '0s' : exhaleTransition.includes('6s'),
        'Breathing exhale transition did not respect the motion preference.');

      const cloudStage = document.getElementById('cloud-stage');
      cloudStage.innerHTML = buildGuideIllustrationSvg('cloud-checked');
      const cloudPlayer = createWatercolorGuidePlayer({
        guideId: 'cloud-checked',
        stage: cloudStage
      });
      const cloudDrift = cloudStage.querySelector('.wgi-cloud-drift');
      const selectableCloud = cloudStage.querySelector('.wgi-cloud');
      requireValue(getComputedStyle(cloudDrift).animationName === 'wgi-story-cloud-checked-cloud', 'Cloud idle drift was not active on its outer group.');
      requireValue(getComputedStyle(selectableCloud).animationName === 'none', 'Cloud selection transform is still masked by an animation.');
      requireValue(cloudPlayer.setCloudSelection('cumulus'), 'Cumulus selection was rejected.');
      await wait(950);
      const cumulusTransform = getComputedStyle(selectableCloud).transform;
      requireValue(cloudStage.dataset.cloudSelection === 'cumulus', 'Cumulus selection was not reflected on the stage.');
      requireValue(cumulusTransform !== 'none', 'Cumulus selection did not transform the cloud.');
      requireValue(cloudPlayer.setCloudSelection('stratus'), 'Stratus selection was rejected.');
      await wait(950);
      const stratusTransform = getComputedStyle(selectableCloud).transform;
      requireValue(stratusTransform !== cumulusTransform, 'Stratus selection did not change the cloud shape.');
      requireValue(cloudPlayer.setCloudSelection('stratocumulus'), 'Stratocumulus selection was rejected.');
      await wait(950);
      const stratocumulusOpacity = Number(getComputedStyle(selectableCloud).opacity);
      requireValue(Number.isFinite(stratocumulusOpacity) && Math.abs(stratocumulusOpacity - 0.78) < 0.01,
        'Stratocumulus selection opacity did not settle near 0.78; computed: ' + stratocumulusOpacity);


      const allGuides = document.getElementById('all-guides');
      const actionAnimations = [];
      const storyboardMotionChanges = [];
      for (const id of GUIDE_ILLUSTRATION_IDS) {
        const stage = document.createElement('div');
        stage.className = 'watercolor-guide-stage';
        stage.innerHTML = buildGuideIllustrationSvg(id);
        allGuides.append(stage);
        const svg = stage.querySelector('.watercolor-guide-svg');
        const storyboard = getGuideStoryboard(id);
        requireValue(svg.dataset.guideId === id, 'Guide ID metadata did not match ' + id + '.');
        requireValue(Boolean(svg.dataset.setting && svg.dataset.camera && svg.dataset.propKind),
          'Storyboard metadata is incomplete for ' + id + '.');
        if (id === 'mid-2') {
          requireValue(svg.dataset.playbackRule === 'timer-driven', 'Breathing lost its timer-driven policy.');
          continue;
        }
        const primaryPart = id === 'cloud-checked'
          ? svg.querySelector('.wgi-cloud-drift')
          : svg.querySelector('[data-primary-motion="true"]');
        requireValue(Boolean(primaryPart), 'Missing articulated primary motion target for ' + id + '.');
        const animationName = getComputedStyle(primaryPart).animationName;
        if (prefersReducedMotion) {
          requireValue(animationName === 'none', 'Action animation remained active under reduced motion for ' + id + '.');
          actionAnimations.push(animationName);
          continue;
        }

        requireValue(animationName.startsWith('wgi-story-' + id + '-'),
          'Action-specific keyframe did not load for ' + id + ': ' + animationName);
        const animation = primaryPart.getAnimations().find((item) => item.animationName === animationName);
        requireValue(Boolean(animation), 'Missing browser animation object for ' + id + '.');
        animation.pause();
        await animation.ready;
        const duration = animation.effect?.getTiming().duration;
        requireValue(Number.isFinite(duration) && duration > 0, 'Invalid browser animation duration for ' + id + '.');
        const movementFrame = storyboard.motion[storyboard.primaryPart]?.find(([, x, y, rotation, scale]) =>
          x !== 0 || y !== 0 || rotation !== 0 || scale !== 1);
        requireValue(Boolean(movementFrame), 'Missing authored non-rest frame for ' + id + '.');
        animation.currentTime = 0;
        const restingTransform = getComputedStyle(primaryPart).transform;
        animation.currentTime = duration * movementFrame[0] / 100;
        const actionTransform = getComputedStyle(primaryPart).transform;
        requireValue(actionTransform !== restingTransform,
          'Primary rig part did not apply its authored motion frame for ' + id + '.');
        actionAnimations.push(animationName);
        storyboardMotionChanges.push(id);
      }
      requireValue(GUIDE_ILLUSTRATION_IDS.length === 23, 'The browser fixture did not cover 23 guide IDs.');
      requireValue(actionAnimations.length === 22, 'The 22 non-timer storyboards were not accounted for.');
      if (prefersReducedMotion) {
        requireValue(actionAnimations.every((name) => name === 'none'), 'Reduced motion left a storyboard animation active.');
        requireValue(storyboardMotionChanges.length === 0, 'A storyboard motion was sampled while reduced motion was active.');
      } else {
        requireValue(new Set(actionAnimations).size === 22, 'Two different guide IDs share a primary motion sequence.');
        requireValue(storyboardMotionChanges.length === 22, 'Not every storyboard primary part visibly applied its authored motion.');
      }

      hydrationPlayer.destroy();
      breathingPlayer.destroy();
      cloudPlayer.destroy();
      window.__guidePlayerBrowserResult = {
        ready: true,
        prefersReducedMotion,
        hydrationAnimation: hydrationStyle.animationName,
        storyboardAnimations: actionAnimations,
        storyboardMotionVerified: storyboardMotionChanges.length,
        storyboardCount: GUIDE_ILLUSTRATION_IDS.length,
        hydrationMoved: hydrationStartTransform !== hydrationEndTransform,
        breathingScales: { resting: restingScale, inhale: inhaleScale },
        breathingTransitions: { inhale: inhaleTransition },
        cloudTransforms: { cumulus: cumulusTransform, stratus: stratusTransform },
        stratocumulusOpacity,
        cloudIdleAnimation: getComputedStyle(cloudDrift).animationName
      };
    } catch (error) {
      window.__guidePlayerBrowserResult = { ready: true, error: error?.stack || String(error) };
    }
  </script>
</body>
</html>
