name = "faith-focus-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

[[kv_namespaces]]
binding = "VAULT_PACKETS"
id = "ea1ec0c70eb945f3bb51ba982021c1a2"

[[durable_objects.bindings]]
name = "VAULT_COORDINATOR"
class_name = "VaultCoordinator"

[[durable_objects.bindings]]
name = "ACCOUNT_REGISTRY"
class_name = "AccountRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountRegistry"]


# Approximate per-location edge limits. Per-account exact limits remain in Durable Objects.
[[ratelimits]]
name = "AUTH_IP_RATE_LIMITER"
namespace_id = "94001"

[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "SENSITIVE_IP_RATE_LIMITER"
namespace_id = "94002"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "VAULT_IP_RATE_LIMITER"
namespace_id = "94003"

[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "VAULT_WRITE_IP_RATE_LIMITER"
namespace_id = "94004"

[ratelimits.simple]
limit = 20
period = 60
